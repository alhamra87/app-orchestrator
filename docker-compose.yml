version: '3.9'

services:
  api:
    build: .
    container_name: app-orchestrator-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: app-orchestrator-redis
    ports:
      - "6379:6379"
